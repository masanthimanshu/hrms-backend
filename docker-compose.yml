services:
  app:
    build: .
    ports:
      - "5500:5500"
    env_file:
      - .env
    environment:
      - DB_URL=mongodb://mongo:27017/hrms
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
